; supervisord config for the PcapHouse all-in-one container.
;
; Runs two long-lived processes:
;   * uvicorn  — FastAPI on 127.0.0.1:8000 (loopback only; nginx proxies
;                to it, we never expose it to the host)
;   * nginx    — foreground mode, serves the frontend bundle + /api proxy
;
; Both log to stdout/stderr so ``docker logs`` shows everything. If either
; process dies, supervisord restarts it; if it keeps dying, supervisord
; gives up (startretries) and we rely on ``restart: unless-stopped`` in
; compose to recycle the whole container.
;
; NOTE: we intentionally do NOT define a ``[supervisord]`` section here.
; This file is dropped into /etc/supervisord.d/pcaphouse.ini and the
; Fedora ``supervisor`` package already ships a main /etc/supervisord.conf
; with its own ``[supervisord]`` / ``[unix_http_server]`` / ``[rpcinterface]``
; sections (plus an ``[include]`` that pulls /etc/supervisord.d/*.ini) —
; defining them twice would make supervisord refuse to start with a
; ``duplicate section`` error. ``nodaemon`` is instead forced via the
; ``-n`` flag in the Dockerfile CMD.

[program:uvicorn]
command=python -m uvicorn main:app --host 127.0.0.1 --port 8000 --no-use-colors
directory=/app
autostart=true
autorestart=true
startretries=5
; Forward everything to the container's stdout/stderr so ``docker logs``
; shows the FastAPI log stream directly.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Give uvicorn up to 20s to finish in-flight requests on SIGTERM.
stopasgroup=true
killasgroup=true
stopwaitsecs=20

[program:nginx]
; ``daemon off;`` keeps nginx in the foreground so supervisord can
; supervise it; the stock Fedora nginx package defaults to daemon mode.
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=10
