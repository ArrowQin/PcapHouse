# Nginx config for the PcapHouse all-in-one container.
#
# * serves the Vite build output from /app/frontend (copied in by the
#   backend Dockerfile's multi-stage build)
# * reverse-proxies /api to the uvicorn instance running on the same
#   container's loopback (supervisord keeps them co-resident)
# * SPA fallback: unknown paths serve index.html so client-side routing works

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Cap upload size to match backend's MAX_FILE_SIZE (500 MiB, see
    # backend/config.py). 0 disables the nginx-side limit; we keep an
    # explicit number so uploads fail fast at the proxy layer with a
    # clear 413 rather than disconnecting mid-stream.
    client_max_body_size 550m;

    root /app/frontend;
    index index.html;

    # ---- API reverse proxy ----
    # uvicorn listens on 127.0.0.1:8000 in the same container (see
    # supervisord.conf). Using the loopback address — instead of a
    # docker-network service name — keeps the compose file single-service
    # and means no extra hop.
    #
    # In addition to /api/ (where all our endpoints live), we also proxy
    # FastAPI's auto-generated doc endpoints so users can hit
    # http://host:<port>/docs without needing a separate backend port.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Pcap uploads / generation can take a while. Give the backend
        # plenty of time before nginx cuts the connection.
        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # Disable buffering so long-running endpoints (task status polls,
        # file downloads) stream through in real time.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # FastAPI's built-in documentation surfaces — served by the backend,
    # not by us. Keep them reachable without exposing uvicorn's port.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static assets ----
    # Vite fingerprints every file in /assets with a content hash, so those
    # are safe to cache aggressively. Everything else (index.html mainly)
    # must not be cached or users stay pinned to an old build after upgrade.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — serve index.html for any path that doesn't match a
    # real file, so react-router can take over on the client.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
